[package]
name = "nalendar"
version = "0.1.0"
edition = "2024"
description = "Modern terminal calendar application"
keywords = ["calendar", "terminal", "tui", "productivity"]
categories = ["command-line-utilities"]
repository = "https://github.com/nikero41/nalendar"
homepage = "https://github.com/nikero41/nalendar"
license = "MIT"

[dependencies]
ratatui = "0.30.0"
color-eyre = "0.6.3"
crossterm = "0.29.0"
reqwest = { version = "0.13", features = ["json", "form"] }
tokio = { version = "1", features = ["full"] }
open = "5.3.4"
serde = { version = "1.0.149", features = ["derive"] }
serde_json = "1.0.89"
url = "2.5.8"
axum = "0.8.9"
owo-colors = "4.3.0"
inquire = "0.9.4"
clap = { version = "4.6.1", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
